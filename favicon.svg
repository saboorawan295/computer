<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#darkBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Outer Chip Pins -->
  <!-- Top Pins -->
  <line x1="20" y1="2" x2="20" y2="8" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="2" x2="32" y2="8" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="2" x2="44" y2="8" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <!-- Bottom Pins -->
  <line x1="20" y1="56" x2="20" y2="62" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="56" x2="32" y2="62" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="56" x2="44" y2="62" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <!-- Left Pins -->
  <line x1="2" y1="20" x2="8" y2="20" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="2" y1="32" x2="8" y2="32" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="2" y1="44" x2="8" y2="44" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <!-- Right Pins -->
  <line x1="56" y1="20" x2="62" y2="20" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="32" x2="62" y2="32" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="44" x2="62" y2="44" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>

  <!-- Inner Chip Surface -->
  <rect x="10" y="10" width="44" height="44" rx="8" fill="#0f172a" stroke="url(#gsGrad)" stroke-width="1.8"/>

  <!-- Circuit traces -->
  <circle cx="16" cy="16" r="1.5" fill="#00d4ff"/>
  <circle cx="48" cy="16" r="1.5" fill="#00d4ff"/>
  <circle cx="16" cy="48" r="1.5" fill="#00d4ff"/>
  <circle cx="48" cy="48" r="1.5" fill="#00d4ff"/>

  <!-- Stylized "GS" Text -->
  <text x="32" y="38" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="url(#gsGrad)" text-anchor="middle" letter-spacing="-0.5">GS</text>
</svg>
